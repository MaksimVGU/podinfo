controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    create: true
    content: |
      logging {
        level = "info"
        format = "logfmt"
      }

      discovery.kubernetes "podinfo_pods" {
        role = "pod"
        namespaces {
          names = ["podinfo"]
        }
      }

      discovery.relabel "podinfo_logs" {
        targets = discovery.kubernetes.podinfo_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
      }

      loki.source.kubernetes "podinfo" {
        targets = discovery.relabel.podinfo_logs.output
        forward_to = [loki.write.podinfo.receiver]
      }

      loki.write "podinfo" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }

        external_labels = {
          cluster = "podinfo-cluster",
        }
      }
