apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - loki-datasource.yaml
  - podinfo-servicemonitor.yaml

configMapGenerator:
  - name: podinfo-dashboard
    files:
      - podinfo.json=dashboards/podinfo.json
    options:
      labels:
        grafana_dashboard: "1"
