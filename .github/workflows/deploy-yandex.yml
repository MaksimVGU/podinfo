name: Deploy to Yandex Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: podinfo-yandex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Podinfo with Helm
    if: github.ref == 'refs/heads/master' && github.repository == 'MaksimVGU/podinfo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/MaksimVGU');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              issuer: payload.iss,
              subject: payload.sub,
              audience: payload.aud
            }, null, 2));

      - name: Get Yandex Cloud IAM token using OIDC
        id: yc-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_DEPLOY_SERVICE_ACCOUNT_ID }}

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_TOKEN: ${{ steps.yc-token.outputs.token }}
        run: |
          yc config set token "$YC_TOKEN"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Configure Kubernetes access
        run: |
          yc managed-kubernetes cluster get-credentials \
            --id "${{ secrets.YC_K8S_CLUSTER_ID }}" \
            --external \
            --force
          kubectl cluster-info

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Deploy Podinfo
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          helm upgrade --install podinfo charts/podinfo \
            --namespace podinfo \
            --create-namespace \
            --values charts/podinfo/values-yandex.yaml \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m
          kubectl get deployments,services,pods -n podinfo
