name: Deploy to Yandex Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: podinfo-yandex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Podinfo with Helm
    if: github.ref == 'refs/heads/master' && github.repository == 'MaksimVGU/podinfo'
    runs-on: podinfo-vpc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/MaksimVGU');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              issuer: payload.iss,
              subject: payload.sub,
              audience: payload.aud
            }, null, 2));

      - name: Get Yandex Cloud IAM token using GitHub OIDC
        id: yc-token
        env:
          YC_SA_ID: ${{ secrets.YC_DEPLOY_SERVICE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2FMaksimVGU"

          OIDC_TOKEN="$(
            curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_URL" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"

          YC_TOKEN="$(
            curl -fsS -X POST \
              https://auth.yandex.cloud/oauth/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              --data-urlencode "audience=${YC_SA_ID}" \
              --data-urlencode "subject_token=${OIDC_TOKEN}" \
              --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          )"

          echo "::add-mask::$YC_TOKEN"
          echo "token=$YC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_TOKEN: ${{ steps.yc-token.outputs.token }}
        run: |
          echo "YC_IAM_TOKEN=$YC_TOKEN" >> "$GITHUB_ENV"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
          yc config set endpoint "api.cloud.yandex.net:443"

      - name: Diagnose Yandex Cloud access
        env:
          YC_TOKEN: ${{ steps.yc-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "=== Yandex Cloud CLI version ==="
          yc version
          echo "=== Check configured cloud and folder ==="
          yc config list
          echo "=== Check cluster metadata ==="
          yc managed-kubernetes cluster get "${{ secrets.YC_K8S_CLUSTER_ID }}" --format json > /tmp/cluster.json
          python3 - <<'PYCLUSTER'
          import json
          with open("/tmp/cluster.json") as f:
              c = json.load(f)
          master = c.get("master", {})
          endpoints = master.get("endpoints", {})
          print("Cluster status:", c.get("status", "unknown"))
          print("Cluster health:", c.get("health", "unknown"))
          print("External endpoint present:", bool(endpoints.get("external_v4_endpoint")))
          print("Internal endpoint present:", bool(endpoints.get("internal_v4_endpoint")))
          PYCLUSTER
          echo "=== Get Kubernetes credentials ==="
          yc managed-kubernetes cluster get-credentials "${{ secrets.YC_K8S_CLUSTER_ID }}" --internal --force
          kubectl cluster-info

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Deploy Podinfo
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          helm upgrade --install podinfo charts/podinfo \
            --namespace podinfo \
            --create-namespace \
            --values charts/podinfo/values-yandex.yaml \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m
          kubectl get deployments,services,pods -n podinfo
